name: Blog validation and deployment

on:
  push:
    branches: [main, stage]
    paths: ['blog/**', '.github/workflows/blog.yml', 'public/brand/**', 'public/fonts/darbareh/**', 'public/favicon.ico', 'public/favicon.svg', 'public/apple-touch-icon.png', 'design-system/tokens.css']
  pull_request:
    paths: ['blog/**', '.github/workflows/blog.yml', 'public/brand/**', 'public/fonts/darbareh/**', 'public/favicon.ico', 'public/favicon.svg', 'public/apple-touch-icon.png', 'design-system/tokens.css']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blog
    env:
      BLOG_ORIGIN: http://localhost:9090
      BLOG_DATA_DIR: /tmp/hmghadam-blog-ci-build
      BLOG_REVISION: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build && npm run test:integration
      - name: Build isolated deployment image
        run: |
          python3 -m py_compile blog/deploy/release.py
          sh -n blog/deploy/install.sh
          docker build -f blog/Dockerfile --build-arg "BLOG_REVISION=$GITHUB_SHA" -t hamghadam-blog:ci .
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' hamghadam-blog:ci)" = "$GITHUB_SHA"
        working-directory: .

  deploy-blog:
    name: Deploy blog from ${{ github.ref_name }}
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: deploy-blog-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://hmghadam.com' || 'https://blog-stage.hmghadam.com' }}
    steps:
      - name: Release the validated blog commit
        env:
          DEPLOY_HOST: ${{ secrets[github.ref_name == 'main' && 'DEPLOY_HOST' || 'STAGE_DEPLOY_HOST'] }}
          DEPLOY_USER: ${{ secrets[github.ref_name == 'main' && 'DEPLOY_USER' || 'STAGE_DEPLOY_USER'] }}
          DEPLOY_KEY: ${{ secrets[github.ref_name == 'main' && 'DEPLOY_SSH_KEY' || 'STAGE_DEPLOY_SSH_KEY'] }}
          KNOWN_HOSTS: ${{ secrets[github.ref_name == 'main' && 'DEPLOY_KNOWN_HOSTS' || 'STAGE_DEPLOY_KNOWN_HOSTS'] }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "${DEPLOY_KEY:?Missing deploy key}" > "$key_dir/key"
          printf '%s\n' "${KNOWN_HOSTS:?Missing known hosts}" > "$key_dir/known_hosts"
          ssh -T -i "$key_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$key_dir/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "${DEPLOY_USER:?}@${DEPLOY_HOST:?}" "deploy-blog $GITHUB_SHA"
      - name: Verify the public production revision
        if: github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 15 https://hmghadam.com/api/health |
            jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .service == "hamghadam-blog" and .revision == $sha'
