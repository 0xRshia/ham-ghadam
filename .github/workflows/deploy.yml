name: CI and deployment

on:
  pull_request:
    branches: [main, stage]
  push:
    branches: [main, stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Validate Node and Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: |
          npm run typecheck
          npm run lint
          npm run test:docs
          python3 -m unittest discover -s tests -p 'production_deploy_test.py' -v
      - name: Domain and frontend regressions
        run: |
          npm run test:discovery
          npm run test:sqlite
          npm run test:media
          npm run test:notifications
          npm run test:account-checkout
          npm run test:fast-organizers
          npm run test:event-sync
          node tests/event-teaser.mjs
          node tests/event-date-labels.mjs
          node tests/organizer-avatar.mjs
          node tests/organizer-navigation.mjs
          npm run test:otp
          node tests/legal-agreements.mjs
          node tests/event-story.mjs
          node tests/location-catalog.mjs
          node tests/map-layout.mjs
          node tests/map-markers.mjs
          node tests/map-clusters.mjs
          node tests/map-configuration.mjs
          node tests/map-introduction.mjs
          node tests/map-rtl.mjs
      - name: Build and exercise the Node release
        run: |
          npm run build:node
          npm run test:build-assets
          npm run test:docs:node
          npm run test:fast:node
      - name: Verify isolated Docker deployment and persistent data
        run: npm run test:docker

  deploy:
    name: Deploy production
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://app.hmghadam.com
    steps:
      - name: Deploy the checked main commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}" "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}" "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          ssh_options=(-i "$key_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_COMMIT"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" status

  deploy-stage:
    name: Deploy staging
    needs: checks
    if: github.ref == 'refs/heads/stage' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://stage.hmghadam.com
    steps:
      - name: Deploy the checked stage commit
        env:
          DEPLOY_HOST: ${{ secrets.STAGE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGE_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGE_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGE_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing STAGE_DEPLOY_HOST}" "${DEPLOY_USER:?Missing STAGE_DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing STAGE_DEPLOY_SSH_KEY}" "${DEPLOY_KNOWN_HOSTS:?Missing STAGE_DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          ssh_options=(-i "$key_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_COMMIT"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" status
