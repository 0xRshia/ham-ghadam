# Install after issuing the game.hmghadam.com certificate.
server {
    listen 80;
    listen [::]:80;
    server_name game.hmghadam.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 301 https://game.hmghadam.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.hmghadam.com;

    ssl_certificate /etc/letsencrypt/live/game.hmghadam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.hmghadam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;

    location = / {
        return 308 https://game.hmghadam.com/game$is_args$args;
    }
    location ~ ^/(?:game(?:/|$)|_next/static/|brand/|fonts/|icons/|figma/vectors/|banners/squirrel/|favicon[^/]*\.(?:ico|png|svg)$) {
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        return 404;
    }
}
