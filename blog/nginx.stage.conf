# Install the HTTP block first; enable HTTPS after issuing this host's certificate.
server {
    listen 80;
    listen [::]:80;
    server_name blog-stage.hmghadam.com;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://blog-stage.hmghadam.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog-stage.hmghadam.com;

    ssl_certificate /etc/letsencrypt/live/blog-stage.hmghadam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog-stage.hmghadam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 6m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / {
        proxy_pass http://127.0.0.1:9190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_cache off;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
    }
}
