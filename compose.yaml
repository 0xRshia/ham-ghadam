services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env.docker}
    environment:
      MVP_RUNTIME: node
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/hmghadam.sqlite
      MEDIA_PATH: /data/media
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app-data:/data
  event-sync:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env.docker}
    environment:
      EVENT_SYNC_JOB_ORIGIN: http://app:3000
    entrypoint: ["node", "/app/scripts/event-sync-worker.mjs"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 60s

volumes:
  app-data:
